<!DOCTYPE html lang="es">
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Renty</title>
        <link rel="stylesheet" href="css/styles.css">
        <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css">
        <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css">
    </head>
    <body>
        <header>
            <figure id="logo-container">
                <canvas id="logo-canvas" width="400" height="267"></canvas>
            </figure>
        </header>
        <nav id="navbar">
                <ul>
                    <li><a href="#home">Inicio</a></li>
                    <li><a href="catalogue">Catalogo</a></li>
                    <li><a href="#reservas">Reservas</a></li>
                    <li><a href="#contacto">Contacto</a></li>
                    <li class="search">
                        <form action="#search-results" method="get">
                            <input type="text" id="search" name="query" placeholder="Buscar...">
                            <button type="submit">🔍</button>
                        </form>
                </ul>
            </nav>

        <main>
            <section id="home">
                <article class="carousel">
                    <figure><img src="images/e-type.jpg" alt=""></figure>
                    <figure><img src="images/911.jpg" alt=""></figure>
                    <figure><img src="images/vantage.jpg" alt=""></figure>
                </article>

                <article id="bienvenida">
                    <h2>Bienvenido a Renty</h2>
                    <p>Alquila coches exclusivos con nosotros. ¡Haz tu reserva ahora!</p>
                </article>
                
                <article id="location">
                    <h3>Encuentra nuestras sedes mas cercanas</h3>
                    <button id="get-location">Encontrar sede más cercana</button>
                    <p id="location-result">⭢⭢Tu ubicación se mostrará aquí⭠⭠</p>
                </article>

                <article id="calendar">
                    <h3>Calenadrio de disponibilidad de coches</h3>
                    <iframe src="https://calendar.google.com/calendar/embed?src=c_6dc68a3342ce401ed204163461507e6384dfac1d9ccd5de4486cd193cea948cb%40group.calendar.google.com&ctz=Europe%2FMadrid"
                        id="googleCalendar"
                        frameborder="0"
                        scrolling="no">
                    </iframe>
                </article>
            </section>
        </main>

        <footer>
            <p>&copy; 2025 Renty. Todos los derechos reservados.</p>
        </footer>
        
        <!-- jQuery -->
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

        <!-- Slick Carousel -->
        <script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>

        <!--Llamada archivo .js-->
        <script src="js/script.js"></script>
    </body>
</html>
